<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="760" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="36" fill="#e5e5e5"/>
  <circle cx="20" cy="18" r="6" fill="#d9534f"/>
  <circle cx="40" cy="18" r="6" fill="#f0ad4e"/>
  <circle cx="60" cy="18" r="6" fill="#5cb85c"/>
  <rect x="90" y="8" width="400" height="20" rx="4" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="100" y="22" font-size="12" fill="#555555">notas-soap.local/registrar</text>

  <text x="40" y="70" font-size="22" font-weight="bold" fill="#222222">Registrar nota SOAP y diagnóstico</text>
  <text x="40" y="92" font-size="13" fill="#777777">Rol: Médico tratante</text>

  <rect x="40" y="110" width="380" height="28" fill="#eeeeee" stroke="#cccccc"/>
  <text x="48" y="129" font-size="13" fill="#555555">Expediente: EXP-4821 (no editable) ①</text>
  <rect x="440" y="110" width="200" height="28" fill="#eeeeee" stroke="#cccccc"/>
  <text x="448" y="129" font-size="13" fill="#555555">Doctor: Dra. R. Pineda ②</text>

  <!-- Subjetivo -->
  <text x="40" y="168" font-size="14" font-weight="bold" fill="#222222">Subjetivo</text>
  <rect x="40" y="176" width="820" height="50" fill="#ffffff" stroke="#999999" stroke-dasharray="4,3"/>
  <text x="50" y="205" font-size="13" font-style="italic" fill="#aaaaaa">Ej.: "Refiere dolor de cabeza desde hace dos días..."</text>
  <text x="40" y="240" font-size="11" fill="#888888">Ayuda: lo que el paciente cuenta, en sus propias palabras. ③</text>

  <!-- Objetivo -->
  <text x="40" y="270" font-size="14" font-weight="bold" fill="#222222">Objetivo</text>
  <rect x="40" y="278" width="820" height="50" fill="#ffffff" stroke="#999999" stroke-dasharray="4,3"/>
  <text x="50" y="307" font-size="13" font-style="italic" fill="#aaaaaa">Ej.: "TA 120/80, FC 78, afebril"</text>
  <text x="40" y="342" font-size="11" fill="#888888">Ayuda: signos vitales y hallazgos medibles del examen.</text>

  <!-- Analisis -->
  <text x="40" y="372" font-size="14" font-weight="bold" fill="#222222">Análisis</text>
  <rect x="40" y="380" width="820" height="50" fill="#ffffff" stroke="#999999" stroke-dasharray="4,3"/>
  <text x="50" y="409" font-size="13" font-style="italic" fill="#aaaaaa">Ej.: "Migraña probable, sin signos de alarma"</text>
  <text x="40" y="444" font-size="11" fill="#888888">Ayuda: la interpretación clínica del doctor.</text>

  <!-- Plan -->
  <text x="40" y="474" font-size="14" font-weight="bold" fill="#222222">Plan</text>
  <rect x="40" y="482" width="820" height="50" fill="#ffffff" stroke="#999999" stroke-dasharray="4,3"/>
  <text x="50" y="511" font-size="13" font-style="italic" fill="#aaaaaa">Ej.: "Analgésico y control en 48h si no mejora"</text>

  <!-- Diagnostico -->
  <rect x="30" y="552" width="840" height="150" fill="#f7f7fb" stroke="#dddddd"/>
  <text x="45" y="578" font-size="15" font-weight="bold" fill="#222222">Diagnóstico asociado</text>

  <text x="45" y="605" font-size="13" fill="#555555">Código CIE-10</text>
  <rect x="45" y="611" width="150" height="28" fill="#ffffff" stroke="#999999" stroke-dasharray="4,3"/>

  <text x="220" y="605" font-size="13" fill="#555555">Descripción</text>
  <rect x="220" y="611" width="330" height="28" fill="#ffffff" stroke="#999999" stroke-dasharray="4,3"/>

  <text x="575" y="605" font-size="13" fill="#555555">Tipo ④</text>
  <rect x="575" y="611" width="270" height="28" fill="#ffffff" stroke="#999999"/>
  <text x="585" y="630" font-size="12" fill="#888888">Seleccionar ▾</text>
  <text x="45" y="660" font-size="11" fill="#888888">Opciones visibles antes de enviar: principal · secundario · presuntivo · definitivo</text>

  <rect x="700" y="720" width="160" height="34" rx="4" fill="#2f6fed"/>
  <text x="730" y="742" font-size="14" fill="#ffffff">Registrar nota</text>

  <!-- Leyenda -->
  <text x="40" y="736" font-size="11" fill="#555555">① Dato protegido, precargado ② Autoría de sesión, no editable</text>
  <text x="40" y="750" font-size="11" fill="#555555">③ Ayuda contextual bajo cada sección ④ Validación de tipo antes de enviar</text>
</svg>
