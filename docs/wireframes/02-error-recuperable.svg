<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="760" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="36" fill="#e5e5e5"/>
  <circle cx="20" cy="18" r="6" fill="#d9534f"/>
  <circle cx="40" cy="18" r="6" fill="#f0ad4e"/>
  <circle cx="60" cy="18" r="6" fill="#5cb85c"/>
  <rect x="90" y="8" width="400" height="20" rx="4" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="100" y="22" font-size="12" fill="#555555">notas-soap.local/registrar</text>

  <text x="40" y="70" font-size="22" font-weight="bold" fill="#222222">Registrar nota SOAP y diagnóstico</text>

  <rect x="40" y="86" width="820" height="36" fill="#fdecea" stroke="#d9534f"/>
  <text x="50" y="109" font-size="13" fill="#a33a34">⚠ No se pudo registrar: la sección "Subjetivo" no puede estar vacía. ①</text>

  <rect x="40" y="138" width="380" height="28" fill="#eeeeee" stroke="#cccccc"/>
  <text x="48" y="157" font-size="13" fill="#555555">Expediente: EXP-4821 (no editable)</text>

  <!-- Subjetivo con error -->
  <text x="40" y="196" font-size="14" font-weight="bold" fill="#a33a34">Subjetivo ②</text>
  <rect x="40" y="204" width="820" height="50" fill="#fff5f5" stroke="#d9534f" stroke-width="2"/>
  <text x="50" y="233" font-size="13" font-style="italic" fill="#cc9999">(vacío)</text>
  <text x="40" y="268" font-size="11" fill="#a33a34">Campo obligatorio. El texto se conserva en los demás campos: no hace falta reescribir todo. ③</text>

  <!-- Objetivo (intacto) -->
  <text x="40" y="300" font-size="14" font-weight="bold" fill="#222222">Objetivo</text>
  <rect x="40" y="308" width="820" height="50" fill="#ffffff" stroke="#999999"/>
  <text x="50" y="337" font-size="13" fill="#333333">TA 120/80, FC 78, afebril</text>

  <!-- Analisis (intacto) -->
  <text x="40" y="392" font-size="14" font-weight="bold" fill="#222222">Análisis</text>
  <rect x="40" y="400" width="820" height="50" fill="#ffffff" stroke="#999999"/>
  <text x="50" y="429" font-size="13" fill="#333333">Migraña probable, sin signos de alarma</text>

  <!-- Plan (intacto) -->
  <text x="40" y="484" font-size="14" font-weight="bold" fill="#222222">Plan</text>
  <rect x="40" y="492" width="820" height="50" fill="#ffffff" stroke="#999999"/>
  <text x="50" y="521" font-size="13" fill="#333333">Analgésico y control en 48h si no mejora</text>

  <rect x="700" y="580" width="160" height="34" rx="4" fill="#2f6fed"/>
  <text x="725" y="602" font-size="14" fill="#ffffff">Reintentar envío</text>

  <rect x="40" y="640" width="820" height="80" fill="#f7f7fb" stroke="#dddddd"/>
  <text x="50" y="662" font-size="12" font-weight="bold" fill="#444444">Regla de interacción</text>
  <text x="50" y="682" font-size="11" fill="#555555">El error se muestra apenas responde la API (después del estado de carga), señalando el campo exacto</text>
  <text x="50" y="698" font-size="11" fill="#555555">que falló. Ningún otro campo se borra. El foco del teclado se mueve automáticamente al campo con error.</text>

  <text x="40" y="748" font-size="11" fill="#555555">① Mensaje textual real de la API (nota_incompleta) ② Borde e indicador visual en el campo ③ Recuperación sin perder el resto de lo ya escrito</text>
</svg>
